version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      target-branch: kit/livewire
      groups:
          dependencies:
              patterns: ['*']

    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
          timezone: Asia/Jakarta
      versioning-strategy: increase-if-necessary
      target-branch: kit/livewire
      groups:
          dependencies:
              patterns: ['*']

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          timezone: Asia/Jakarta
      versioning-strategy: increase-if-necessary
      target-branch: kit/livewire
      groups:
          dependencies:
              patterns: ['*']
