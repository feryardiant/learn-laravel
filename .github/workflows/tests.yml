name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    uses: projek-xyz/actions/.github/workflows/prepare.yml@87f32f457f1cc99f163afcc7634a339618017c55
    with:
      php-version: ${{ vars.PHP_VERSION || '8.4' }}
    permissions:
      contents: read
      pull-requests: write

  unit:
    name: Unit
    runs-on: ubuntu-latest
    needs: [prepare]
    permissions:
      contents: read

    env:
      PHP_VERSION: ${{ vars.PHP_VERSION || '8.4' }}
      DB_CONNECTION: pgsql
      DB_DATABASE: ${{ github.repository_owner }}
      DB_USERNAME: ${{ github.repository_owner }}
      DB_PASSWORD: secret

    services:
      pgsql:
        image: postgres:18
        env:
          POSTGRES_DB: ${{ env.DB_DATABASE }}
          POSTGRES_USER: ${{ env.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug

      - name: Prepare Composer Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ needs.prepare.outputs.composer-cache-dir }}
          key: php${{ env.PHP_VERSION }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: php${{ env.PHP_VERSION }}-composer-

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --ansi
          npm ci

      - name: Setup
        run: |
          cp .github/.env.example .env
          php artisan key:generate --ansi
          php artisan migrate --force --ansi

      - name: Build
        run: |
          npm run build

      - name: Test
        run: |
          composer test
