services:
  app:
    extends:
      file: docker/compose.yaml
      service: app
    build:
      context: .
      dockerfile: docker/staging/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        BASE_OS: ${BASE_OS:-alpine}
        BASE_VERSION: ${BASE_VERSION:-3.24}
    environment:
      AUTORUN_LARAVEL_MIGRATION: true
      AUTORUN_LARAVEL_MIGRATION_SEED: true
    ports:
      - ${APP_PORT:-8080}:8080

  scheduler:
    extends:
      file: docker/compose.yaml
      service: worker
    container_name: learn-laravel-scheduler
    command: [./artisan, schedule:work, --whisper]
    healthcheck:
      test: [CMD, healthcheck-schedule]

  queue:
    extends:
      file: docker/compose.yaml
      service: worker
    container_name: learn-laravel-queue
    command: [./artisan, queue:work, --tries=3, --sleep=3, --timeout=0]
    healthcheck:
      test: [CMD, healthcheck-queue]

  pgsql:
    extends:
      file: docker/compose.yaml
      service: pgsql

  mailpit:
    extends:
      file: docker/compose.yaml
      service: mailpit

networks:
  default:
    name: learn-laravel-staging
    enable_ipv6: false
