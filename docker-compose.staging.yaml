services:
  app:
    extends:
      file: docker/compose.yaml
      service: app
    build:
      context: .
      dockerfile: docker/staging/Dockerfile
    image: ghcr.io/feryardiant/learn-laravel:staging
    container_name: learn-laravel-app
    environment: &environment
      APP_DEBUG: false
      APP_ENV: staging
      LOG_LEVEL: info
      DB_HOST: pgsql
      MAIL_HOST: mailpit
    ports:
      - ${APP_PORT:-8080}:8080
    volumes:
      - ./storage/app:/var/www/html/storage/app

  schedule:
    extends:
      file: docker/compose.yaml
      service: worker
    command: [./artisan, schedule:work, --whisper]
    container_name: learn-laravel-schedule
    environment: *environment
    volumes:
      - ./storage/app:/var/www/html/storage/app
    healthcheck:
      test: [CMD, healthcheck-schedule]

  queue:
    extends:
      file: docker/compose.yaml
      service: worker
    command: [./artisan, queue:work, --tries=3, --sleep=3, --timeout=60]
    container_name: learn-laravel-queue
    environment: *environment
    volumes:
      - ./storage/app:/var/www/html/storage/app
    healthcheck:
      test: [CMD, healthcheck-queue]

  pgsql:
    extends:
      file: docker/compose.yaml
      service: pgsql
    ports:
      - ${FORWARD_DB_PORT:-5432}:5432

  mailpit:
    extends:
      file: docker/compose.yaml
      service: mailpit
    ports:
      - ${FORWARD_MAILPIT_APP_PORT:-8025}:8025
      - ${FORWARD_MAILPIT_MAIL_PORT:-1025}:1025

networks:
  default:
    name: learn-laravel-staging
    enable_ipv6: false

volumes:
  mailpit-data:
    driver: local
  pgsql-data:
    driver: local
