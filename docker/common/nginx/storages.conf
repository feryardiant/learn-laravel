# Serve Laravel's "public" disk straight from storage so `Storage::url()` /
# `Storage::disk('public')->url()` resolve without the `public/storage` symlink
# that `php artisan storage:link` creates. The symlink is disabled in this image
# via `AUTORUN_LARAVEL_STORAGE_LINK=false`; config/filesystems.php points the
# "public" disk's `url` at `<APP_URL>/storage`.
#
# `^~` is a prefix match on purpose: `^~` wins over regex locations regardless
# of include order, so the base image's extension regexes (`performance.conf`,
# matching `.png` / `.css` / …) cannot shadow the alias and bounce the request
# through `try_files` to the app's 404.
location ^~ /storage/ {
    alias /var/www/html/storage/app/public/;

    # `^~` also skips the base image's regex guard
    # here — otherwise an uploaded `.php` file is served as plain source.
    location ~* \.php$ { deny all; }
}
