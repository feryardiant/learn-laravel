#
# Development only — reverse-proxy the Vite dev server through this app's origin.
#
# The Vite dev server listens on plain HTTP (127.0.0.1:5173), while the app is
# served over HTTPS (e.g. through the OrbStack proxy). Loading dev assets
# directly from http://… on an HTTPS page is blocked by the browser as mixed
# content, so instead the browser loads them same-origin and nginx forwards
# them to Vite.
#
# `server.origin` in vite.config.ts points at the app origin so the generated
# dev asset URLs stay same-origin. Keep the locations below in sync with it.
#
# These are `^~` prefix locations on purpose. nginx checks the longest prefix
# match before evaluating regex locations, and `^~` forbids falling through to
# the base image's `performance.conf`, whose regexes match `.css` / `.js` /
# `.woff2` and would otherwise shadow the proxy and return the app's 404.
# `^~` wins on its own, so the order this file is included in does not matter.
#
# Each proxy location turns off its own access log: the dev noise is all here,
# so silencing these keeps the app's own requests visible in the dev log.
#

# Vite's internal paths all live under `/@`: the client (`/@vite/client`,
# `/@vite/env`), virtual modules (`/@id/...`), files outside the project root
# (`/@fs/...`) and the React refresh runtime (`/@react-refresh`).
location ^~ /@ {
    access_log off;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Pre-bundled dependencies (Vite optimizes them into node_modules/.vite/deps).
location ^~ /node_modules/ {
    access_log off;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Application source assets (the laravel() input plus everything they import).
location ^~ /resources/ {
    access_log off;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Vite HMR websocket (see `server.hmr.path` in vite.config.ts).
location = /vite-hmr {
    access_log off;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
